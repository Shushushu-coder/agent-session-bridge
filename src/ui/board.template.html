<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker Board</title>
<style>
:root {
  --bg: #ffffff; --fg: #1a1d21; --muted: #6b7280; --border: #e5e7eb;
  --chip: #f3f4f6; --accent: #2563eb; --header: #fafafa;
  --c-ready: #16a34a; --c-busy: #2563eb; --c-init: #d97706;
  --c-err: #dc2626; --c-idle: #6b7280;
}
:root[data-theme="dark"] {
  --bg: #0f1115; --fg: #e5e7eb; --muted: #9ca3af; --border: #262a33;
  --chip: #1c2028; --header: #14171d;
  --c-ready: #4ade80; --c-busy: #60a5fa; --c-init: #fbbf24;
  --c-err: #f87171; --c-idle: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --fg: #e5e7eb; --muted: #9ca3af; --border: #262a33;
    --chip: #1c2028; --header: #14171d;
    --c-ready: #4ade80; --c-busy: #60a5fa; --c-init: #fbbf24;
    --c-err: #f87171; --c-idle: #9ca3af;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 10px 12px; background: var(--bg); color: var(--fg);
  font: 12px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
}
.topbar {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 13px; margin: 0; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-idle); flex: none; }
.dot.ok { background: var(--c-ready); }
.dot.err { background: var(--c-err); }
.grow { flex: 1; }
.grow2 { flex: 1; min-width: 0; }
button {
  font: inherit; color: var(--fg); background: var(--chip);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 2px 8px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
.err-banner {
  margin: 8px 0; padding: 6px 8px; border: 1px solid var(--c-err);
  border-radius: 6px; color: var(--c-err); display: none;
}
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
h2.live-h { color: var(--c-busy); }

.statstrip { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.stat {
  padding: 1px 8px; border-radius: 999px; font-size: 11px;
  background: var(--chip); color: var(--muted); border: 1px solid var(--border);
}
.stat-busy { color: var(--c-busy); border-color: var(--c-busy); }
.stat-err { color: var(--c-err); border-color: var(--c-err); }

.wcard {
  border: 1px solid var(--border); border-left: 3px solid var(--border);
  border-radius: 8px; padding: 7px 10px; margin-bottom: 8px;
}
.wcard.st-busy { border-left-color: var(--c-busy); }
.wcard.st-ready { border-left-color: var(--c-ready); }
.wcard.st-error, .wcard.st-initialization_uncertain { border-left-color: var(--c-err); }
.wtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wname { font-weight: 600; }
.wline { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; }
.err-text { color: var(--c-err); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.taskline {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 2px; border-bottom: 1px solid var(--border); font-size: 11px;
}
.taskline.live { padding-left: 8px; border-left: 2px solid var(--c-busy); }
.batch-wrap { padding: 5px 2px; border-bottom: 1px solid var(--border); }

details { margin: 10px 0 0; }
details > summary {
  cursor: pointer; font-size: 11px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--muted); list-style: none;
}
details > summary::before { content: '▸ '; }
details[open] > summary::before { content: '▾ '; }
details > summary:hover { color: var(--fg); }
details[open] > summary { margin-bottom: 4px; }

.chip {
  display: inline-block; padding: 0 7px; border-radius: 999px;
  font-size: 10px; white-space: nowrap; background: var(--chip);
  border: 1px solid var(--border); flex: none;
}
.chip.st-ready { color: var(--c-ready); border-color: var(--c-ready); }
.chip.st-busy, .chip.st-running, .chip.st-accepted, .chip.st-initializing {
  color: var(--c-busy); border-color: var(--c-busy);
}
.chip.st-error, .chip.st-failed, .chip.st-unknown { color: var(--c-err); border-color: var(--c-err); }
.chip.st-initialization_uncertain, .chip.st-pending_initialization { color: var(--c-init); border-color: var(--c-init); }
.chip.st-completed { color: var(--c-ready); border-color: var(--c-ready); }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px; }
.dim { color: var(--muted); }
.bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--chip); margin-top: 4px; }
.bar > span { display: block; height: 100%; }
.bar .b-completed { background: var(--c-ready); }
.bar .b-running { background: var(--c-busy); }
.bar .b-failed { background: var(--c-err); }
.bar .b-unknown { background: var(--c-init); }
.bar .b-accepted { background: var(--c-idle); }
.foot { margin-top: 12px; color: var(--muted); font-size: 11px; display: flex; gap: 10px; }
.empty { color: var(--muted); padding: 10px 0; }
.progress-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">connecting…</div>
<script>/*__APP__*/</script>
</body>
</html>
